name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zerivex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zerivex_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zerivex_test
      SESSION_SECRET: ci-only-test-secret-never-use-in-production
      INITIAL_OWNER_EMAIL: owner@example.test
      NEXT_PUBLIC_APP_URL: https://example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
      - run: npm run build
      - run: npm run typecheck
