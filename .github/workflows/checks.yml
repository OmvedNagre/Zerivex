name: Project checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated_test_password
          POSTGRES_DB: zerivex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated_test_password@localhost:5432/zerivex_test?sslmode=disable
      DATABASE_URL: postgresql://postgres:isolated_test_password@localhost:5432/zerivex_test?sslmode=disable
      SESSION_SECRET: isolated_ci_session_secret_never_use_in_production
      NEXT_PUBLIC_APP_URL: https://localhost:3000
      INITIAL_OWNER_EMAIL: owner@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
